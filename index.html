<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniimo Type Matchups</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e9edf5;--panel:#ffffffcc;--line:#9aa6bd;--text:#1d2433;--mut:#5d6985;--chip:#dfe5f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c2030;--panel:#2a2f44cc;--line:#5b6482;--text:#eef1fa;--mut:#9ba5c3;--chip:#383e58}}
:root[data-theme="dark"]{--bg:#1c2030;--panel:#2a2f44cc;--line:#5b6482;--text:#eef1fa;--mut:#9ba5c3;--chip:#383e58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0,#6a5acd33,transparent 50%),radial-gradient(circle at 90% 100%,#2bb7c933,transparent 50%),var(--bg);color:var(--text);font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:20px 14px 40px}
h1{text-align:center;font-size:1.7rem;margin:6px 0 2px;letter-spacing:.04em}
.sub{text-align:center;color:var(--mut);margin:0 0 18px;font-size:.9rem}
.grid{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;position:relative;backdrop-filter:blur(6px)}
.card:before,.card:after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--line)}
.card:before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.card:after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);margin:0 0 10px}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:700px){.types{grid-template-columns:repeat(5,1fr)}}
.t{border:2px solid transparent;background:var(--chip);border-radius:12px;padding:6px 2px;cursor:pointer;color:var(--text);font:inherit;font-size:.68rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.t.on{border-color:var(--c);box-shadow:0 0 12px var(--c)}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
.ic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sel{display:flex;gap:8px;align-items:center;margin-top:12px;min-height:34px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;color:#fff;font-weight:800;font-size:.8rem}
.pill .ic{width:24px;height:24px;border-radius:99px;background:#0003!important}.pill .ic svg{width:15px;height:15px}
button.clear{margin-top:10px;width:100%;padding:7px;border-radius:9px;border:1.5px solid var(--line);background:transparent;color:var(--text);font:inherit;cursor:pointer}
.sec{margin-bottom:16px}
.sec h3{margin:0 0 8px;font-size:1rem}
.row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.mult{min-width:54px;text-align:center;font-weight:900;border-radius:8px;padding:4px 6px;font-size:.85rem;color:#fff}
.m4{background:#d83a3a}.m2{background:#e9962b}.mh{background:#4a8bd8}.mq{background:#3a58b8}.m0{background:#555}.mg{background:#2fa36b}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:5px;background:var(--chip);border-radius:99px;padding:3px 10px 3px 3px;font-size:.78rem;font-weight:700}
.chip .ic{width:24px;height:24px;border-radius:99px}.chip .ic svg{width:15px;height:15px}
.none{color:var(--mut);font-size:.85rem}
.sm{font-size:.8rem;color:var(--mut);margin:8px 0 4px;font-weight:800}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
</style></head><body><div class="wrap">
<h1>ANIIMO · TYPE MATCHUPS</h1>
<p class="sub">Pick one or two elements to see weaknesses and strengths</p>
<div class="grid">
<div class="card"><h2>Elements</h2><div class="types" id="types"></div>
<div class="sel" id="sel"></div><button class="clear" id="clr">Clear</button></div>
<div class="card" id="out"></div>
</div>
<p class="sub" style="margin-top:18px">O w O</p>
</div>
<script>
const T=[
{n:"Ice",c:"#2bb7c9",g:'<path d="M12 3v18M4 7.5l16 9M4 16.5l16-9"/>'},
{n:"Water",c:"#2d7de0",g:'<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>'},
{n:"Electric",c:"#d9b800",g:'<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>'},
{n:"Fire",c:"#e05555",g:'<path d="M12 3c1 4 6 6 6 11a6 6 0 0 1-12 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4 0-6 2-10z"/>'},
{n:"Grass",c:"#3fa56f",g:'<path d="M5 19c0-9 5-14 14-14 0 9-5 14-14 14zM5 19l8-8"/>'},
{n:"Ground",c:"#b9a074",g:'<path d="M3 19l6-11 4 6 3-4 5 9z"/>'},
{n:"Wind",c:"#4ecbb0",g:'<path d="M12 12m-2 0a2 2 0 1 0 4 0 2 2 0 1 0-4 0M12 6a6 6 0 1 1-6 6M12 3a9 9 0 1 1-9 9"/>'},
{n:"Dark",c:"#8a4fd0",g:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'},
{n:"Light",c:"#f09a2a",g:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'}];
// rows = attacker, cols = defender; 2 = up, .5 = down, 1 = blank
const U=2,D=.5,N=1;
const C=[
[D,U,U,D,N,D,N,N,N],
[D,D,N,U,D,U,N,N,D],
[D,U,D,N,N,D,U,N,N],
[U,D,N,D,U,D,N,N,D],
[N,U,N,D,D,U,N,N,D],
[U,D,N,U,D,D,N,D,N],
[N,N,D,N,U,N,D,U,N],
[N,D,U,N,U,N,D,N,U],
[N,N,D,N,N,N,U,U,D]];
let sel=[];
const $=id=>document.getElementById(id);
const ic=i=>`<span class="ic" style="background:${T[i].c}"><svg viewBox="0 0 24 24">${T[i].g}</svg></span>`;
const chip=i=>`<span class="chip">${ic(i)}${T[i].n}</span>`;
$("types").innerHTML=T.map((t,i)=>`<button class="t" data-i="${i}" style="--c:${t.c}">${ic(i)}${t.n}</button>`).join("");
$("types").onclick=e=>{const b=e.target.closest(".t");if(!b)return;const i=+b.dataset.i;
 if(sel.includes(i))sel=sel.filter(x=>x!==i);else{sel.push(i);if(sel.length>2)sel.shift();}render();};
$("clr").onclick=()=>{sel=[];render();};
function row(cls,label,list){return list.length?`<div class="row"><span class="mult ${cls}">${label}</span><div class="chips">${list.map(chip).join("")}</div></div>`:"";}
function render(){
 document.querySelectorAll(".t").forEach(b=>b.classList.toggle("on",sel.includes(+b.dataset.i)));
 $("sel").innerHTML=sel.map(i=>`<span class="pill" style="background:${T[i].c}">${ic(i)}${T[i].n}</span>`).join("")||'<span class="none">Nothing selected</span>';
 if(!sel.length){$("out").innerHTML='<div class="empty">Select an element on the left to begin.</div>';return;}
 const def=T.map((_,a)=>sel.reduce((m,d)=>m*C[a][d],1));
 const idx=v=>def.map((m,i)=>m===v?i:-1).filter(i=>i>=0);
 const w4=idx(4),w2=idx(2),r5=idx(.5),r25=idx(.25);
 let h=`<div class="sec"><h3>🛡 Defending — takes extra damage from</h3>${row("m4","4×",w4)}${row("m2","2×",w2)}${!w4.length&&!w2.length?'<span class="none">No weaknesses</span>':''}</div>`;
 h+=`<div class="sec"><h3>🛡 Defending — resists</h3>${row("mh","½×",r5)+row("mq","¼×",r25)}${!r5.length&&!r25.length?'<span class="none">No resistances</span>':''}</div>`;
 h+=`<div class="sec"><h3>⚔ Attacking — deals extra damage to</h3>`;
 sel.forEach(s=>{const up=C[s].map((m,i)=>m===2?i:-1).filter(i=>i>=0);
  h+=`<div class="sm">${T[s].n} attacks</div>${row("mg","2×",up)||'<span class="none">No super-effective targets</span>'}`;});
 h+=`</div><div class="sec"><h3>⚔ Attacking — resisted by</h3>`;
 sel.forEach(s=>{const dn=C[s].map((m,i)=>m===.5?i:-1).filter(i=>i>=0);
  h+=`<div class="sm">${T[s].n} attacks</div>${row("mh","½×",dn)||'<span class="none">None</span>'}`;});
 $("out").innerHTML=h+"</div>";
}
render();
</script></body></html>
